# Overlay: confirm capacity for maxReplicas and rollout surge before enabling.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
pdb:
  enabled: true
  maxUnavailable: 1
