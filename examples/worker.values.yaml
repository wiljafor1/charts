image:
  repository: registry.example.com/team/worker
  tag: "1.0.0"
command: ["/app/worker"]
service:
  enabled: false
startupProbe:
  enabled: false
readinessProbe:
  enabled: false
livenessProbe:
  enabled: false
# Add app-specific exec probes when available; a worker need not listen on HTTP.
envFrom:
  - secretRef:
      name: worker-secrets
