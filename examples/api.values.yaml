# Replace the example image with your own non-root application image.
image:
  repository: registry.example.com/team/api
  tag: "1.0.0"
containerPort: 8080

configMap:
  enabled: true
  data:
    LOG_LEVEL: info
    PORT: "8080"

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: api-secrets
        key: database-url

startupProbe:
  type: httpGet
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  type: httpGet
  httpGet:
    path: /readyz
    port: http
# Enable only when the endpoint accurately detects an unrecoverable app failure.
livenessProbe:
  enabled: true
  type: httpGet
  httpGet:
    path: /healthz
    port: http
